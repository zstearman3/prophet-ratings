# Overcommit configuration for prophet-ratings
# Runs fast linters plus full RSpec and Brakeman before allowing a commit.
# You can bypass hooks with: git commit --no-verify

CommitMsg:
  TrailingPeriod:
    enabled: true
  TextWidth:
    enabled: false

PreCommit:
  # Basic hygiene
  TrailingWhitespace:
    enabled: true
  YamlSyntax:
    enabled: true
  JsonSyntax:
    enabled: true
  MergeConflicts:
    enabled: true

  # Ruby/Rails checks
  RuboCop:
    enabled: true
    description: "Run RuboCop"
    command: ["rubocop"]

PrePush:
  RSpec:
    enabled: true
    description: "Run RSpec test suite"
    command: ["make", "test"]
    required_executable: "docker"
  Brakeman:
    enabled: true
    description: "Run Brakeman security scan"
    command: ["docker", "compose", "-f", "docker-compose.yml", "-f", "compose.dev.yml", "run", "--rm", "--no-deps", "web", "bundle", "exec", "brakeman", "-q", "-w2", "-x", "EOLRails,EOLRuby"]
    required_executable: "docker"

# RSpec and Brakeman run on PrePush to keep commits fast.
