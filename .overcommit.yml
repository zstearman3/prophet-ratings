# Overcommit configuration for prophet-ratings
# Runs native Ruby checks using the versions locked in Gemfile.lock.
gemfile: Gemfile

verify_signatures: false

CommitMsg:
  TrailingPeriod:
    enabled: true
  TextWidth:
    enabled: false

PreCommit:
  # Basic hygiene
  TrailingWhitespace:
    enabled: true
  YamlSyntax:
    enabled: true
  JsonSyntax:
    enabled: true
  MergeConflicts:
    enabled: true

  # Ruby/Rails checks
  RuboCop:
    enabled: true
    description: "Run RuboCop"
    command: ["bundle", "exec", "rubocop"]

PrePush:
  Reek:
    enabled: true
    description: "Check for new code smells"
    command: ["bundle", "exec", "reek"]
    required_executable: "bundle"
  RSpec:
    enabled: true
    description: "Run RSpec test suite"
    command: ["bin/test", "--local"]
    required_executable: "docker"
  Brakeman:
    enabled: true
    description: "Run Brakeman security scan"
    command: ["bundle", "exec", "brakeman"]
    flags: ["-q", "-w2", "-x", "EOLRails,EOLRuby"]
    required_executable: "bundle"

# Reek, RSpec and Brakeman run on PrePush to keep commits fast.
