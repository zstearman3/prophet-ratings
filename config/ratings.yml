default: &default
  bundle_name: "v1.7-shared-pace"
  preseason:
    previous_season_weight: 0.85
    fallback_efficiency: 105.5
    fallback_pace: 69.5
    adjustment_start_after_days: 14
    profile:
      recruiting_score_multiplier: 0.1
      attrition_multiplier: 5.0
      max_efficiency_adjustment: 5.0
  weighting:
    recency_decay_days: 60.0
    min_recency_weight: 0.75
    preseason_decay_days: 40
    min_preseason_weight: 0.1
  blowout:
    max_margin: 15
    cap_multiplier: 1.25
  baseline_volatility:
    efficiency_volatility: 11.5
    pace_volatility: 4.5
  home_court_advantage: 2.2
  home_court_adjusted_stats:
  - offensive_efficiency
  - defensive_efficiency
  ridge:
    alpha: 0.001
  anchor:
    weight: 0.05
development:
  <<: *default

test:
  <<: *default

production:
  <<: *default

# Opt-in authored settings; publish/select deliberately, never activate automatically.
coaching_experiment:
  <<: *default
  bundle_name: "v1.8-experimental-coaching-pace"
  preseason:
    previous_season_weight: 0.85
    fallback_efficiency: 105.5
    fallback_pace: 69.5
    adjustment_start_after_days: 14
    profile:
      recruiting_score_multiplier: 0.1
      attrition_multiplier: 5.0
      max_efficiency_adjustment: 5.0
    coaching:
      formula: relative_pace_v2
      weight: 0.50
