# Merge into preseason on a newly named model; never loaded by default.
efficiency_adjustment:
  formula: reviewed_net_v1
  lower_bound: -1.0
  upper_bound: 5.0
recruiting:
  formula: class_points_baseline_v1
  weight: 1.0
  class_points_lower: 60.0
  class_points_upper: 70.0
  baseline_net_lower: 0.0
  baseline_net_upper: 30.0
  attenuation_floor: 0.2
  max_net_efficiency: 5.0
departures:
  formula: points_share_v1
  weight: 1.0
  slope: 2.0
  max_net_efficiency: 1.0
