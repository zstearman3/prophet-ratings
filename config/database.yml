default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

development:
  <<: *default
  database: prophet_ratings_development

test:
  <<: *default
  database: prophet_ratings_test
  # An explicit test URL prevents an exported development/production DATABASE_URL
  # from redirecting specs to the wrong database.
  url: <%= ENV.fetch("TEST_DATABASE_URL", "postgresql:///prophet_ratings_test") %>

production:
  url: <%= ENV["DATABASE_URL"] %>
